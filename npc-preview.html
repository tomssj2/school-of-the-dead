<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC Preview</title>
<style>
  :root { --bg: #14161d; --panel: #1f232d; --border: #343a48; --text: #e6e9ef; --muted: #9aa3b5; --accent: #f4c542; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .stage { overflow: hidden; }
  .npc { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 10px 14px; background: var(--panel); border: 1px solid var(--border); text-align: center; }
  .stage { display: grid; place-items: end center; width: 100%; height: 236px; background: linear-gradient(180deg, #2a3040, #1a1e28 70%, #2b2620 70%, #221e19); border: 1px solid var(--border); }
  .room { font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); }
  .name { font-size: 15px; font-weight: 800; }
  .nick { color: var(--accent); font-weight: 700; }
  .ref { font-size: 11.5px; color: var(--muted); }
  .line { font-size: 12px; font-style: italic; color: #cfd5e2; }
  .scale { margin: 0 0 14px; color: var(--muted); }
</style>
</head>
<body>
<h1>The staff</h1>
<p class="sub">Each NPC at 3× (one art pixel = 3 screen pixels).</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { NPCS, npcSprite, NPC_SIZE } from "./js/npcs.js";
  const ROOM = { gym: "Gym · STR", acrobatics: "Acrobatics · DEX", Biology: "Biology · CON", Physics: "Physics · INT", History: "History · WIS", SocialStudies: "Social Studies · CHA", cafeteria: "Cafeteria", infirmary: "Nurse's Office", research: "Research Room", crafting: "Crafting Room", radio: "Radio Station", farm: "Farm", barn: "Barn", scrapyard: "Scrapyard", headmaster: "Headmaster's Office" };
  const q = new URLSearchParams(location.search);
  const scale = Number(q.get("scale")) || 3;
  const only = q.get("ids")?.split(",");
  if (only) document.getElementById("grid").style.gridTemplateColumns = `repeat(${only.length}, auto)`;
  const order = only || ["doubledoor", "mopovich", "quinzwheel", "frankenstitch", "quarkwell", "bickus", "seen", "grillsay", "brockbride", "whiteboard", "gyber", "bulldog", "plowson", "cowper", "scrapperson"];
  document.getElementById("grid").innerHTML = order.map((id) => {
    const n = NPCS[id];
    return `<div class="npc"><div class="stage" style="height:${NPC_SIZE.h * scale + 12}px">${npcSprite(id, scale)}</div>
      <div class="room">${ROOM[n.room]}</div>
      <div class="name">${n.name}</div>
      <div class="nick">"${n.nickname}"</div>
      <div class="ref">Inspired by ${n.ref}</div>
      <div class="line">“${n.lines[0]}”</div></div>`;
  }).join("");
</script>
</body>
</html>
